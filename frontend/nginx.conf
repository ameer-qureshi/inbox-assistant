server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS: re-resolve "backend" so a recreated backend container (new IP)
    # is found again, instead of the address cached when nginx started
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Same origin for site and API: the session cookie works without CORS
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The webhook routes are for n8n only (internal Docker network): not exposed
    location /api/webhooks/ { return 404; }

    # Single-page app: unknown paths serve index.html
    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
