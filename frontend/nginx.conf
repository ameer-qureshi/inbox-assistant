server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin for site and API: the session cookie works without CORS
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The webhook routes are for n8n only (internal Docker network): not exposed
    location /api/webhooks/ { return 404; }

    # Single-page app: unknown paths serve index.html
    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
